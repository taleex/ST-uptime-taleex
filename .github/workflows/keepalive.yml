name: Keep Databases Alive

on:
  schedule:
    # Run every 5 days to prevent 7-day Supabase auto-pause
    - cron: "0 0 */5 * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  keep-alive:
    name: Wake databases to prevent suspension
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - name: Supabase FMG
            url_secret: SUPABASE_URL_FMG
            key_secret: SUPABASE_KEY_FMG
          - name: Supabase Taleex
            url_secret: SUPABASE_URL_TALEEX
            key_secret: SUPABASE_KEY_TALEEX
          - name: Supabase Nexor
            url_secret: SUPABASE_URL_NEXOR
            key_secret: SUPABASE_KEY_NEXOR
    steps:
      - name: "Keep ${{ matrix.project.name }} alive"
        env:
          SUPABASE_URL: ${{ secrets[matrix.project.url_secret] }}
          SUPABASE_KEY: ${{ secrets[matrix.project.key_secret] }}
        run: |
          echo "Pinging ${{ matrix.project.name }} with real database query..."
          
          # Step 1: Force PostgREST schema introspection (real pg_catalog DB query)
          echo "  → PostgREST schema introspection..."
          INTROSPECT_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 20 \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}" \
            "${SUPABASE_URL}/rest/v1/?format=openapi" 2>&1)
          echo "    HTTP ${INTROSPECT_CODE}"
          
          # Step 2: Execute SELECT 1 via PostgREST with count query (forces real SQL)
          echo "  → PostgREST count query..."
          COUNT_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --connect-timeout 15 \
            --max-time 20 \
            --request GET \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}" \
            --header "Accept: application/json" \
            --header "Prefer: count=exact" \
            "${SUPABASE_URL}/rest/v1/" 2>&1)
          echo "    HTTP ${COUNT_CODE}"
          
          echo "  → ${{ matrix.project.name }} done!"